<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เช็คคนเข้า-ออกไซต์งาน</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2a30">
<style>
:root{--bg:#f4f4ef;--ink:#1f2a30;--hi:#f2c200;--ok:#1b7f3b;--bad:#c0262d;--line:#d4d4cb;--card:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141b1f;--ink:#eef0ea;--line:#33414a;--card:#1f2a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans Thai","Sarabun",sans-serif;font-size:17px;line-height:1.5}
header{background:#1f2a30;color:#fff;padding:14px 16px;border-bottom:6px solid var(--hi);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:18px;margin:0}
#count{font-size:34px;font-weight:700;color:var(--hi);line-height:1}
#count small{display:block;font-size:12px;font-weight:400;color:#fff}
main{max-width:560px;margin:0 auto;padding:14px}
#reader{width:100%;border-radius:8px;overflow:hidden;background:#000;min-height:80px}
#banner{margin:12px 0;padding:18px;border-radius:8px;background:var(--card);border:2px solid var(--line);text-align:center;min-height:110px}
#banner.ok{background:var(--ok);border-color:var(--ok);color:#fff}
#banner.bad{background:var(--bad);border-color:var(--bad);color:#fff}
#banner b{font-size:24px;display:block}
.row{display:flex;gap:8px;margin:8px 0}
input[type=text]{flex:1;padding:12px;font-size:17px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
button{padding:12px 16px;font-size:17px;border:0;border-radius:8px;background:#1f2a30;color:#fff;cursor:pointer}
button.hi{background:var(--hi);color:#1f2a30;font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.ppe{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0;font-size:15px}
h2{font-size:17px;margin:20px 0 6px}
ul{list-style:none;padding:0;margin:0}
li{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
li span{opacity:.7;font-size:14px}
#status{font-size:13px;opacity:.8}
</style>
</head>
<body>
<header><h1>เช็คคนเข้า-ออกไซต์งาน<div id="status"></div></h1><div id="count">0<small>คนในไซต์</small></div></header>
<main>
<div class="ppe" id="ppe">
 <label><input type="checkbox" value="หมวก" checked> หมวก</label>
 <label><input type="checkbox" value="รองเท้า" checked> รองเท้า</label>
 <label><input type="checkbox" value="เสื้อสะท้อนแสง" checked> เสื้อสะท้อนแสง</label>
 <label><input type="checkbox" value="ถุงมือ"> ถุงมือ</label>
</div>
<div id="reader"></div>
<div id="banner"><b>พร้อมสแกน</b>สแกน QR บนบัตร หรือพิมพ์รหัสด้านล่าง</div>
<div class="row"><input type="text" id="manual" placeholder="พิมพ์รหัส เช่น W001" autocomplete="off"><button class="hi" id="go">บันทึก</button></div>
<h2>คนที่อยู่ในไซต์ตอนนี้</h2>
<ul id="inside"></ul>
<div class="row"><button id="exp">ส่งออก CSV</button><button id="clr">ล้างข้อมูล</button></div>
</main>
<script src="html5-qrcode.min.js"></script>
<script>
// ---------- ฐานข้อมูลในเครื่อง (IndexedDB) ----------
let db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('checkin',1);
 r.onupgradeneeded=()=>r.result.createObjectStore('logs',{keyPath:'n',autoIncrement:true});
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=m=>db.transaction('logs',m).objectStore('logs');
const addLog=l=>new Promise(r=>{tx('readwrite').add(l).onsuccess=r});
const allLogs=()=>new Promise(r=>{tx('readonly').getAll().onsuccess=e=>r(e.target.result)});
const clearLogs=()=>new Promise(r=>{tx('readwrite').clear().onsuccess=r});

// ---------- รายชื่อคนงาน ----------
let workers={};
async function loadWorkers(){
 try{const r=await fetch('workers.json');const a=await r.json();a.forEach(w=>workers[w.id]=w);}catch(e){banner('bad','โหลดรายชื่อไม่ได้','เปิดแอปตอนมีเน็ตหนึ่งครั้งก่อน');}
}

// ---------- ตรรกะหลัก ----------
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const stamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function banner(cls,title,sub){$('banner').className=cls;$('banner').innerHTML=`<b>${title}</b>${sub||''}`;}
function lastStatus(logs){const m={};logs.forEach(l=>m[l.id]=l);return m;}

async function handle(raw){
 const id=String(raw).trim().toUpperCase();
 if(!id)return;
 const w=workers[id];
 if(!w){banner('bad','ไม่พบรหัส '+id,'ไม่อนุญาตเข้า — ติดต่อ จป.');beep(false);return;}
 const logs=await allLogs();
 const last=lastStatus(logs)[id];
 const goingIn=!last||last.dir==='ออก';
 let ppe=[...document.querySelectorAll('#ppe input:checked')].map(x=>x.value).join(' ');
 if(goingIn){
  const expired=!w.induction_expiry||new Date(w.induction_expiry)<new Date(new Date().toDateString());
  if(expired){banner('bad',w.name,'อบรม Safety หมดอายุ/ยังไม่อบรม — ไม่อนุญาตเข้า');beep(false);return;}
 }else ppe='';
 await addLog({id,name:w.name,company:w.company,dir:goingIn?'เข้า':'ออก',time:stamp(new Date()),ppe});
 banner('ok',(goingIn?'เข้า: ':'ออก: ')+w.name,w.company);
 beep(true);render();
}
function beep(ok){try{navigator.vibrate&&navigator.vibrate(ok?80:[100,60,100]);}catch(e){}}

async function render(){
 const logs=await allLogs();const m=lastStatus(logs);
 const inside=Object.values(m).filter(l=>l.dir==='เข้า');
 $('count').firstChild.textContent=inside.length;
 $('inside').innerHTML=inside.map(l=>`<li>${l.name}<span>${l.company} · ${l.time.slice(11,16)}</span></li>`).join('')||'<li>ยังไม่มีใครในไซต์</li>';
}

// ---------- สแกนกล้อง (ไม่ซ้ำภายใน 4 วินาที) ----------
let lastCode='',lastAt=0;
function startScan(){
 if(typeof Html5Qrcode==='undefined'){$('reader').textContent='ไม่พบไฟล์ html5-qrcode.min.js — ใช้ช่องพิมพ์รหัสแทน';return;}
 const s=new Html5Qrcode('reader');
 s.start({facingMode:'environment'},{fps:10,qrbox:220},code=>{
  const now=Date.now();if(code===lastCode&&now-lastAt<4000)return;
  lastCode=code;lastAt=now;handle(code);
 }).catch(()=>{$('reader').textContent='เปิดกล้องไม่ได้ — อนุญาตกล้อง หรือใช้ช่องพิมพ์รหัส';});
}

// ---------- ส่งออก CSV ----------
async function exportCsv(){
 const logs=await allLogs();
 const rows=[['เวลา','รหัส','ชื่อ','บริษัท','เข้า/ออก','PPE']].concat(logs.map(l=>[l.time,l.id,l.name,l.company,l.dir,l.ppe]));
 const csv='\uFEFF'+rows.map(r=>r.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(',')).join('\n');
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
 a.download='checkin-'+stamp(new Date()).slice(0,10)+'.csv';a.click();
}

$('go').onclick=()=>{handle($('manual').value);$('manual').value='';};
$('manual').onkeydown=e=>{if(e.key==='Enter')$('go').click();};
$('exp').onclick=exportCsv;
$('clr').onclick=async()=>{if(confirm('ล้างข้อมูลทั้งหมดในเครื่อง? ส่งออก CSV ไว้แล้วหรือยัง')){await clearLogs();render();}};
function net(){$('status').textContent=navigator.onLine?'ออนไลน์':'ออฟไลน์ (ใช้งานได้ปกติ)';}
addEventListener('online',net);addEventListener('offline',net);

(async()=>{
 net();await open();await loadWorkers();render();startScan();
 if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
})();
</script>
</body>
</html>
